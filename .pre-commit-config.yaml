repos:
  - repo: local
    hooks:
    - id: format-type-lint
      name: format-type-lint
      entry: bash -c "ruff check app --fix && ruff format app"
      language: system
      pass_filenames: false
    - id: lint-check
      name: lint-check
      entry: bash -c "ruff check app && ruff format app --check"
      language: system
      pass_filenames: false
    - id: type-check
      name: type-check
      entry: mypy app
      language: system
      pass_filenames: false
