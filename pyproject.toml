[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-boilerplate"
version = "0.1.0"
description = "FastAPI boilerplate with JWT auth, SQLModel, and request logging"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn==0.51.0",
    "sqlmodel==0.0.39",
    "SQLAlchemy==2.0.51",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "PyJWT==2.13.0",
    "bcrypt==5.0.0",
    "starlette==1.3.1",
    "alembic==1.18.5",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.0",
    "mypy==2.3.0",
    "pre-commit==4.6.1",
    "pip-tools==7.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
python_executable = ".venv/bin/python"

[tool.pyright]
venvPath = "."
venv = ".venv"
